name: Deploy Infra (Terraform AWS)

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch: {}

jobs:
  terraform:
    name: Provisionar S3, CloudFront, ACM & Route 53
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Autenticação OIDC segura com a AWS (sem secrets)
      contents: read
    defaults:
      run:
        working-directory: ./infra/terraform
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::814294708398:role/github-actions
          role-session-name: github-actions-godoy-infra-deploy
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply (Auto Approve)
        run: terraform apply -auto-approve -input=false

      - name: Capturar Outputs do Terraform
        id: tf-outputs
        run: |
          echo "bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "distribution_domain=$(terraform output -raw cloudfront_domain)" >> "$GITHUB_OUTPUT"
          echo "custom_url=$(terraform output -raw custom_domain_url)" >> "$GITHUB_OUTPUT"

      # Sincronização inicial do front-end web/ para o bucket provisionado
      - name: Publicar Conteúdo do Front-End (Sync ./web para S3)
        working-directory: .
        run: |
          aws s3 sync ./web s3://${{ steps.tf-outputs.outputs.bucket }} \
            --delete \
            --exclude "imoveis/*" \
            --cache-control "no-cache, must-revalidate"

      - name: Invalidar Cache do CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ steps.tf-outputs.outputs.distribution_id }} --paths "/*"

      - name: Resumo dos Links Publicados
        run: |
          echo "========================================================"
          echo "🚀 Godoy Corretor Hub Publicado com Sucesso!"
          echo "🔗 URL Personalizada: ${{ steps.tf-outputs.outputs.custom_url }}"
          echo "🌐 URL CloudFront Direta: https://${{ steps.tf-outputs.outputs.distribution_domain }}/index.html"
          echo "========================================================"
